<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera — blurrr</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body>
  <header class="site-header"><a class="logo" href="index.html">blurrr<span>.</span></a><a id="back-link" href="javascript:history.back()">Back to event</a></header>
  <main class="page-shell"><section class="panel">
    <div class="eyebrow">Your disposable camera</div><h1 style="font-size:clamp(2.3rem,6vw,4rem)">Take the shot.</h1>
    <div class="camera-stage"><video id="camera-preview" autoplay playsinline muted aria-label="Live camera preview"></video><canvas id="capture-canvas" hidden></canvas><img id="photo-preview" alt="Captured photo preview" hidden></div>
    <div class="camera-controls">
      <button id="start-camera" class="button button-secondary">Start camera</button>
      <button id="switch-camera" class="button button-secondary">Flip camera</button>
      <label style="margin:0;display:flex;align-items:center;gap:8px"><input id="filter-toggle" type="checkbox" checked> Vintage film</label>
      <button id="shutter" class="shutter" aria-label="Take photo" disabled></button>
      <button id="retake" class="button button-secondary" hidden>Retake</button>
      <button id="upload-photo" class="button button-primary" hidden>Upload memory ↗</button>
    </div>
    <label for="file-input">Or choose a photo from your device</label><input id="file-input" type="file" accept="image/jpeg,image/png,image/webp">
    <p id="status" class="status" role="status">Camera is off until you press Start camera.</p>
  </section></main>
  <script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/camera.js"></script>
</body></html>
